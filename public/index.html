<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Detections Agent</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #111521;
        --panel-2: #161b2a;
        --line: #232a3d;
        --text: #e7ebf3;
        --muted: #8a93a6;
        --accent: #7c9cff;
        --accent-2: #5dd6a9;
        --warn: #f0b86e;
        --err: #ff7a7a;
        --code: #1a2030;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      a { color: var(--accent); }

      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      header.app {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      header.app .logo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        color: #0b0d12;
        font-weight: 800;
      }
      header.app h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      header.app .sub {
        color: var(--muted);
        font-size: 13px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      }

      form.discover {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-items: end;
      }
      form.discover .row-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      form.discover select {
        padding: 12px 14px;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }
      @media (max-width: 720px) {
        form.discover { grid-template-columns: 1fr; }
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      input[type="text"], input[type="password"], textarea {
        width: 100%;
        padding: 12px 14px;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border 0.15s, box-shadow 0.15s;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
        line-height: 1.45;
      }
      form.discover .full-width {
        grid-column: 1 / -1;
      }
      input:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(124, 156, 255, 0.15);
      }
      button.primary {
        padding: 12px 18px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0b0d12;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
        transition: transform 0.05s, opacity 0.15s;
      }
      button.primary:hover { opacity: 0.9; }
      button.primary:active { transform: translateY(1px); }
      button.primary[disabled] { opacity: 0.5; cursor: not-allowed; }

      .section-title {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 28px 4px 10px;
      }

      ul.steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      ul.steps li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
        background: var(--muted);
      }
      .dot.running { background: var(--accent); box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.18); animation: pulse 1.2s infinite; }
      .dot.done { background: var(--accent-2); }
      .dot.failed, .dot.error { background: var(--err); }
      .dot.skipped { background: var(--warn); }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.18); }
        50%      { box-shadow: 0 0 0 8px rgba(124, 156, 255, 0.04); }
      }

      .log {
        margin-top: 12px;
        max-height: 220px;
        overflow: auto;
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--muted);
        white-space: pre-wrap;
      }
      .log .line { display: block; }
      .log .warn { color: var(--warn); }
      .log .error { color: var(--err); }
      .log .info { color: #c8d1e3; }

      .grid-selectors {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .row-sel {
        display: grid;
        grid-template-columns: 220px 1fr auto;
        gap: 10px;
        align-items: center;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .row-sel .key {
        font-size: 12px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row-sel .val {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        word-break: break-all;
        color: var(--text);
      }
      .row-sel .val.empty { color: var(--muted); font-style: italic; }
      .row-sel .copy {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .row-sel .copy:hover { border-color: var(--accent); color: var(--accent); }
      .row-sel .copy:disabled { opacity: 0.4; cursor: not-allowed; }

      .output-wrap {
        position: relative;
      }
      .output-wrap pre {
        margin: 0;
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        overflow: auto;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #d6e0f2;
        max-height: 360px;
      }
      .output-wrap .copy-all {
        position: absolute;
        top: 10px;
        right: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .output-wrap .copy-all:hover { border-color: var(--accent); color: var(--accent); }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      .pill.ok { color: var(--accent-2); border-color: rgba(93, 214, 169, 0.4); }
      .pill.warn { color: var(--warn); border-color: rgba(240, 184, 110, 0.4); }
      .pill.err { color: var(--err); border-color: rgba(255, 122, 122, 0.4); }

      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="app">
        <div class="logo">D</div>
        <div>
          <h1>Detections Agent</h1>
          <div class="sub">
            Crawl a Shopify storefront and derive the 8 theme-native selectors.
          </div>
        </div>
      </header>

      <section class="card" id="form-card">
        <form class="discover" id="form" autocomplete="off">
          <div>
            <label for="storeUrl">Store URL</label>
            <input
              id="storeUrl"
              name="storeUrl"
              type="text"
              placeholder="your-store.myshopify.com"
              required
            />
          </div>
          <div>
            <label for="password">Store password <span style="text-transform: none; color: var(--muted)">(optional)</span></label>
            <input id="password" name="password" type="password" placeholder="(if store is password-protected)" />
          </div>
          <div class="full-width">
            <label for="feedback">Feedback for agent <span style="text-transform: none; color: var(--muted)">(optional)</span></label>
            <textarea
              id="feedback"
              name="feedback"
              placeholder="Give exact selectors when you know them — e.g. cart-page-discount-code: '#main-cart-footer .totals' or cart-page-discount-code should be #main-cart-footer .totals. Parsed hints are DOM-verified and applied even if the LLM misses them. Re-run with feedback after a partial result; previousSelectors are sent automatically."
            ></textarea>
          </div>
          <div class="row-actions">
            <button class="primary" id="submit" type="submit">Run agent</button>
            <span class="meta" id="meta-hint">
              API key and model are configured on the server (<code style="font-size:11px">ANTHROPIC_API_KEY</code>, <code style="font-size:11px">ANTHROPIC_MODEL</code>).
              <span id="model-hint"></span>
            </span>
          </div>
        </form>
      </section>

      <div id="progress-card" class="card hidden" style="margin-top:18px;">
        <div class="section-title" style="margin-top:0">Progress</div>
        <ul class="steps" id="steps"></ul>
        <div class="log" id="log"></div>
      </div>

      <div id="result-card" class="card hidden" style="margin-top:18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div class="section-title" style="margin:0">Selectors</div>
          <span class="pill ok" id="elapsed-pill">done</span>
        </div>

        <div class="grid-selectors" id="rows" style="margin-top:10px;"></div>

        <div class="section-title">output.js</div>
        <div class="output-wrap">
          <button class="copy-all" id="copyAll">Copy output.js</button>
          <pre id="output"></pre>
        </div>
      </div>

      <div id="error-card" class="card hidden" style="margin-top:18px;border-color:rgba(255,122,122,0.3)">
        <div class="section-title" style="margin-top:0;color:var(--err)">Error</div>
        <div id="error-text" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#ffd6d6;"></div>
      </div>
    </div>

    <script>
      const SELECTOR_KEYS = [
        "product-form-selector",
        "home-page-cvb",
        "product-page-cvb",
        "cart-drawer-cvb",
        "cart-page-discount-code",
        "cart-page-cvb",
        "cart-icon",
        "cart-drawer-discount-code",
      ];

      const STEP_LABELS = {
        login: "Login / open home",
        product: "Locate first product",
        "cart-add": "Add product to cart",
        "cart-page": "Fetch /cart page",
        drawer: "Resolve cart drawer markup",
        learn: "Update rules from feedback",
        compact: "Compact scraped HTML for LLM",
        discover: "Discover agent — selectors from LLM",
        verify: "DOM verification",
      };

      const $ = (id) => document.getElementById(id);

      let lastSelectors = null;
      let lastStoreUrl = "";

      /** Mirror server parseFeedbackSelectors — selectors may contain spaces. */
      function parseFeedbackOverrides(feedback) {
        const text = String(feedback || "").trim();
        if (!text) return {};
        const out = {};
        const trim = (v) => {
          let s = String(v || "")
            .trim()
            .replace(/[.,;]+$/, "")
            .trim();
          if (
            (s.startsWith("'") && s.endsWith("'")) ||
            (s.startsWith('"') && s.endsWith('"')) ||
            (s.startsWith("`") && s.endsWith("`"))
          ) {
            s = s.slice(1, -1).trim();
          }
          return s;
        };
        const fenced = text.match(/```(?:json)?\s*(\{[\s\S]*?\})\s*```/);
        if (fenced) {
          try {
            const parsed = JSON.parse(fenced[1]);
            for (const key of SELECTOR_KEYS) {
              if (typeof parsed[key] === "string" && parsed[key].trim()) {
                out[key] = trim(parsed[key]);
              }
            }
          } catch (_) {}
        }
        for (const key of SELECTOR_KEYS) {
          const esc = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const patterns = [
            new RegExp(`(?:^|\\n)\\s*${esc}\\s*[:=]\\s*['"\`]([^'"\`]+)['"\`]`, "gi"),
            new RegExp(`(?:^|\\n)\\s*${esc}\\s*[:=]\\s*(.+?)(?=\\s*(?:\\n|$))`, "gi"),
            new RegExp(
              `${esc}\\s+should\\s+be\\s+(?:['"\`]([^'"\`]+)['"\`]|(.+?)(?=\\s*(?:\\n|$|;)))`,
              "gi",
            ),
            new RegExp(`use\\s+(?:['"\`]([^'"\`]+)['"\`]|(.+?))\\s+for\\s+${esc}`, "gi"),
          ];
          for (const re of patterns) {
            for (const m of text.matchAll(re)) {
              const val = trim(m[1] || m[2]);
              if (val) out[key] = val;
            }
          }
        }
        return out;
      }

      function ensureStep(id, label) {
        const list = $("steps");
        let li = document.getElementById("step-" + id);
        if (!li) {
          li = document.createElement("li");
          li.id = "step-" + id;
          li.innerHTML =
            '<span class="dot"></span><div class="label" style="flex:1;">' +
            (label || id) +
            '</div><div class="msg" style="color:var(--muted);font-size:12px;"></div>';
          list.appendChild(li);
        }
        return li;
      }

      function setStep(id, status, message) {
        const label = STEP_LABELS[id] || id;
        const li = ensureStep(id, label);
        const dot = li.querySelector(".dot");
        dot.className = "dot " + status;
        li.querySelector(".msg").textContent = message || "";
      }

      function appendLog(message, level) {
        const log = $("log");
        const line = document.createElement("span");
        line.className = "line " + (level || "info");
        const time = new Date().toLocaleTimeString();
        line.textContent = "[" + time + "] " + message;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      }

      function renderSelectors(selectors) {
        const rows = $("rows");
        rows.innerHTML = "";
        for (const key of SELECTOR_KEYS) {
          const row = document.createElement("div");
          row.className = "row-sel";
          const value = selectors[key] || "";
          row.innerHTML = `
            <div class="key">${key}</div>
            <div class="val ${value ? "" : "empty"}">${value ? escapeHtml(value) : "(empty — drawer keys only when theme has no drawer)"}</div>
            <button class="copy" data-value="${escapeAttr(value)}" ${value ? "" : "disabled"}>Copy</button>
          `;
          rows.appendChild(row);
        }
        rows.querySelectorAll("button.copy").forEach((btn) => {
          btn.addEventListener("click", () => {
            const v = btn.getAttribute("data-value");
            if (!v) return;
            navigator.clipboard.writeText(v).then(() => {
              const t = btn.textContent;
              btn.textContent = "Copied";
              setTimeout(() => (btn.textContent = t), 1200);
            });
          });
        });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function escapeAttr(s) {
        return String(s).replace(/"/g, "&quot;");
      }

      async function* readLines(reader) {
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            if (buffer.trim()) yield buffer;
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 1);
            if (line.trim()) yield line;
          }
        }
      }

      $("copyAll").addEventListener("click", () => {
        const text = $("output").textContent || "";
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
          const t = $("copyAll");
          const orig = t.textContent;
          t.textContent = "Copied";
          setTimeout(() => (t.textContent = orig), 1200);
        });
      });

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const storeUrl = $("storeUrl").value.trim();
        const password = $("password").value;
        const feedback = $("feedback").value.trim();
        if (!storeUrl) return;

        if (storeUrl !== lastStoreUrl) {
          lastSelectors = null;
          lastStoreUrl = storeUrl;
        }

        $("submit").disabled = true;
        $("submit").textContent = "Running...";
        $("error-card").classList.add("hidden");
        if (!feedback && !lastSelectors) {
          $("result-card").classList.add("hidden");
        }
        $("progress-card").classList.remove("hidden");
        $("steps").innerHTML = "";
        $("log").innerHTML = "";
        if (!feedback) $("output").textContent = "";

        const seedSteps = ["login", "product", "cart-add", "cart-page", "drawer", "learn", "compact", "discover", "verify"];
        for (const k of seedSteps) {
          ensureStep(k, STEP_LABELS[k]);
          if (k === "learn" && !feedback) {
            setStep(k, "skipped", "No feedback provided");
          }
        }

        try {
          const body = { storeUrl, password, feedback: feedback || undefined };
          if (lastSelectors && lastStoreUrl === storeUrl) {
            body.previousSelectors = lastSelectors;
          }
          const overrides = parseFeedbackOverrides(feedback);
          if (Object.keys(overrides).length) {
            body.selectorOverrides = overrides;
          }

          const res = await fetch("/api/discover", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok && res.headers.get("content-type")?.includes("application/json")) {
            const j = await res.json();
            throw new Error(j.error || `HTTP ${res.status}`);
          }
          if (!res.body) throw new Error("No response body");

          let finalResult = null;
          let errored = null;

          const reader = res.body.getReader();
          for await (const line of readLines(reader)) {
            let event;
            try { event = JSON.parse(line); } catch { continue; }
            switch (event.type) {
              case "agent-start":
                appendLog(
                  `Pipeline starting for ${event.storeUrl}${event.willLearn ? " (will update rules doc)" : ""} — model: ${event.model || "claude"}`,
                );
                break;
              case "context-updated":
                appendLog(`Rules doc updated: ${event.summary || event.path}`, "info");
                break;
              case "step":
                setStep(event.id, event.status, event.message || "");
                break;
              case "log":
                appendLog(event.message, event.level);
                break;
              case "llm-request":
                appendLog(
                  `→ Claude ${event.purpose || "discover"}: model=${event.model}${event.userBytes ? `, user=${event.userBytes} B` : ""}`,
                  "info",
                );
                break;
              case "llm-response":
                appendLog(
                  `← Claude ${event.purpose || "discover"}: in=${event.inputTokens ?? "?"} tok, out=${event.outputTokens ?? "?"} tok`,
                  "info",
                );
                break;
              case "selector":
                if (event.value) {
                  const src = event.source ? ` (${event.source})` : "";
                  appendLog(`✓ ${event.key}: ${event.value}${src}`, "info");
                } else if (event.llmRaw) {
                  appendLog(
                    `✗ ${event.key}: dropped "${event.llmRaw}" — ${event.verify?.reason || "verify failed"}`,
                    "warn",
                  );
                }
                break;
              case "result":
                finalResult = event;
                break;
              case "agent-error":
                errored = event.message || "Agent error";
                break;
              case "error":
                errored = event.message || "Error";
                break;
            }
          }

          if (errored) {
            if (finalResult?.selectors) {
              renderSelectors(finalResult.selectors);
              $("output").textContent = finalResult.outputJs || "";
              lastSelectors = finalResult.selectors;
              $("elapsed-pill").textContent = finalResult.partial
                ? `partial — only ${Object.values(finalResult.selectors || {}).filter(Boolean).length}/8 verified`
                : `done in ${finalResult.elapsedMs} ms`;
              $("elapsed-pill").className = finalResult.partial ? "pill warn" : "pill ok";
              $("result-card").classList.remove("hidden");
            }
            throw new Error(errored);
          }
          if (!finalResult) throw new Error("Agent ended without result");

          renderSelectors(finalResult.selectors);
          $("output").textContent = finalResult.outputJs;
          lastSelectors = finalResult.selectors;
          lastStoreUrl = storeUrl;
          $("elapsed-pill").textContent = `done in ${finalResult.elapsedMs} ms`;
          $("elapsed-pill").className = "pill ok";
          $("result-card").classList.remove("hidden");
        } catch (err) {
          if (!$("result-card").classList.contains("hidden")) {
            $("error-text").textContent =
              (err.message || String(err)) + " — partial selectors shown above.";
          } else {
            $("error-text").textContent = err.message || String(err);
          }
          $("error-card").classList.remove("hidden");
        } finally {
          $("submit").disabled = false;
          $("submit").textContent = "Run agent";
        }
      });

      fetch("/api/config")
        .then((r) => r.json())
        .then((cfg) => {
          const el = $("model-hint");
          if (!el) return;
          if (cfg.hasApiKey) {
            el.textContent = ` Model: ${cfg.model || "claude-sonnet-4-6"}.`;
          } else {
            el.textContent = " WARNING: server has no ANTHROPIC_API_KEY — runs will fail.";
            el.style.color = "var(--warn)";
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
